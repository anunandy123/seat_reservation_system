services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seat_reserve
      POSTGRES_USER: seat
      POSTGRES_PASSWORD: seat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat -d seat_reserve"]
      interval: 5s
      timeout: 5s
      retries: 10